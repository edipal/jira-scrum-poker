name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Build, Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint, format check, typecheck, build UI & verify zero-egress manifest
        run: ./.lintel/scripts/build.sh

      - name: Run unit & component test suites
        run: ./.lintel/scripts/test-unit.sh
