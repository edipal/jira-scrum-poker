modules:
  jira:issuePanel:
    - key: scrum-poker-issue-panel
      resource: panel-ui
      resolver:
        function: resolver-fn
      title: Scrum Poker
      icon: resource:panel-assets;icon.svg
  function:
    - key: resolver-fn
      handler: index.handler
resources:
  - key: panel-ui
    path: static/panel/build
  - key: panel-assets
    path: static/assets
permissions:
  scopes:
    - storage:app
    - read:jira-work
    - write:jira-work
    - read:jira-user
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/00000000-0000-0000-0000-000000000000
