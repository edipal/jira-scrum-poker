modules:
  jira:issueContext:
    - key: scrum-poker-issue-context
      resource: panel-ui
      resolver:
        function: resolver-fn
      title: Scrum Poker
      label: Scrum Poker
      icon: resource:panel-assets;icon.svg
  function:
    - key: resolver-fn
      handler: index.handler
resources:
  - key: panel-ui
    path: static/panel/build
  - key: panel-assets
    path: static/assets
permissions:
  scopes:
    - storage:app
    - read:jira-work
    - write:jira-work
    - read:jira-user
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/132c0827-2c3a-4ba1-83f5-7b9d621885a5
